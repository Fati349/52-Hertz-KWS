
training:
  val_split: 0.15
  test_split: 0.15

dataset:
  root_dir: "./data"
  num_classes: 3
  classes:
    - "talky"
    - "silence"
    - "unknown"

quantization:
  dtype: "int8"
  representative_samples: 200

audio:
  sample_rate: 16000
  duration_ms: 1000

features:
  type: log_mel_spectrogram      

  log_mel_spectrogram:
    n_mels: 64                  
    window_ms: 40
    stride_ms: 20
    n_fft: 640                   # 40ms × 16000 / 1000
    hop_length: 320              # 20ms × 16000 / 1000
    n_frames: 50                
    fmin: 0
    fmax: 8000                   # Nyquist à 16kHz
    center: true                 

input_shape: [64, 50, 1]         #   [n_mels, n_frames, channel]