model:
  architecture: dscnn
  variant: S

training:
  batch_size: 64
  epochs: 50
  learning_rate: 0.001
  val_split: 0.15
  test_split: 0.15


quantization:
  dtype: "int8"
  representative_samples: 200

audio:
  sample_rate: 16000
  duration_ms: 1000

features:
  type: mfcc

  mfcc:
    n_mfcc: 10
    window_ms: 40
    stride_ms: 20
    n_fft: 640       # window_ms * sample_rate / 1000
    hop_length: 320  # stride_ms * sample_rate / 1000
    n_frames: 49

input_shape: [49, 10, 1]