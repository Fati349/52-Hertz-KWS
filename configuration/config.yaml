# A revoir ...

audio:
  sample_rate: 16000
  duration_ms: 1000
  n_mfcc: 40
  n_fft: 512
  hop_length: 160
  n_mels: 64
  n_frames: 101

model:
  name: "dscnn"          # dscnn / yamnet / resnet
  variant: "M"           # S / M / L (pour dscnn)
  feature: "mfcc"        # mfcc / log_mel
  input_shape: [40, 101, 1]
  num_classes: 2

training:
  batch_size: 64
  epochs: 50
  learning_rate: 0.001
  val_split: 0.15
  test_split: 0.15

quantization:
  dtype: "int8"
  representative_samples: 100